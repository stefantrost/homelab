---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-bootstrap
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-bootstrap
    app.kubernetes.io/part-of: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:stefantrost/homelab.git
    targetRevision: main
    path: cluster/argocd
    directory:
      recurse: false
      include: '{namespace.yaml,root-app.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 3
